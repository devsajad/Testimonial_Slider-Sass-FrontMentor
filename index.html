<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/sass/main.scss" />
    <script type="module" src="./src/js/main.js"></script>

    <title>Frontend Mentor | Coding Bootcamp Testimonials Slider</title>
  </head>
  <body>
    <div class="container">
      <section class="slider">
        <div class="slider__slider-container">
          <div class="testimonial">
            <blockquote class="testimonial__quote">
              <p>
                “ I've been interested in coding for a while but never taken the
                jump, until now. I couldn't recommend this course enough. I'm
                now in the job of my dreams and so excited about the future. ”
              </p>
            </blockquote>
            <div class="testimonial__author">
              <p>Tanya Sinclair <span>UX Engineer</span></p>
            </div>
          </div>

          <div class="image">
            <img
              src="./assets/images/image-tanya.jpg"
              alt="A woman with curly hair"
              class="image__person"
            />
          </div>
        </div>

        <div class="slider__btn-container">
          <div class="left-arrow-container">
            <img
              src="./assets/images/icon-prev.svg"
              alt="Previous testimonial"
              class="slider__btn-container--left"
            />
          </div>

          <div class="right-arrow-container">
            <img
              src="./assets/images/icon-prev.svg"
              alt="Next testimonial"
              class="slider__btn-container--right"
            />
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
